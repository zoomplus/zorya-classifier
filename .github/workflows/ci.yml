name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix packages/mcp
      - run: npm run check
      - name: Controlled oracle geometry (offline)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s benchmarks/v02/controlled_oracles -p 'test_*.py' -v
      - run: npm run pack:check
      - run: npm run format:check
  mcp-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix packages/mcp
      - name: Docker MCP runtime smoke
        env:
          ZORYA_MCP_EVIDENCE_DIR: ${{ runner.temp }}/zorya-classifier-mcp-evidence
        run: npm --prefix packages/mcp run docker:check
